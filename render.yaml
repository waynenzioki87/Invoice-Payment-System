databases:
  - name: invoicex-db
    plan: 0.1c-256mb
    region: frankfurt
    databaseName: invoicex
    user: invoicex
    diskSizeGB: 1

envVarGroups:
  - name: invoicex-production
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_NAME
        value: INVOICEX
      - key: APP_KEY
        sync: false
      - key: APP_URL
        value: https://invoicex-web.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: pgsql
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_SCHEME
        value: tls
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: INVOICEX
      - key: MPESA_BASE_URL
        value: https://sandbox.safaricom.co.ke
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        value: https://invoicex-web.onrender.com/mpesa/callback
      - key: MPESA_TRANSACTION_TYPE
        value: CustomerPayBillOnline
      - key: MPESA_ACCOUNT_REFERENCE_PREFIX
        value: INVOICEX

services:
  - type: web
    name: invoicex-web
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    preDeployCommand: php artisan migrate --force
    envVars:
      - fromGroup: invoicex-production
      - key: DATABASE_URL
        fromDatabase:
          name: invoicex-db
          property: connectionString

  - type: worker
    name: invoicex-queue
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    envVars:
      - fromGroup: invoicex-production
      - key: DATABASE_URL
        fromDatabase:
          name: invoicex-db
          property: connectionString

  - type: cron
    name: invoicex-scheduler
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerContext: .
    schedule: "* * * * *"
    dockerCommand: php artisan schedule:run
    envVars:
      - fromGroup: invoicex-production
      - key: DATABASE_URL
        fromDatabase:
          name: invoicex-db
          property: connectionString
